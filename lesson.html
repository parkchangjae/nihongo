<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일본어 DAY 수업</title><style>
:root{--navy:#172b4d;--blue:#315b9a;--ink:#202b3c;--muted:#68758a;--line:#e4e9f0;--paper:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;line-height:1.75}.wrap{max-width:900px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:var(--blue);text-decoration:none;font-weight:700}.hero{margin:22px 0;background:var(--navy);color:white;padding:28px;border-radius:20px}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.75}.hero h1{margin:8px 0;font-size:30px}.hero p{margin:0;color:#dce5f4}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}.panel h2{font-size:19px;margin:0 0 12px}.jp{font-size:22px;font-weight:700;color:#173d72}.ko{color:var(--muted)}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.word{padding:12px;border:1px solid var(--line);border-radius:12px}.word b{display:block}.tag{display:inline-block;background:#edf3fb;color:#315b9a;border-radius:20px;padding:3px 10px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;background:var(--navy);color:white;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:700}button.alt{background:#e9eef6;color:var(--navy)}.note{color:var(--muted);font-size:13px}@media(max-width:600px){.hero h1{font-size:25px}.panel{padding:17px}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html">← 전체 로드맵</a><span id="progress" class="tag">DAY</span></div><section class="hero"><div class="eyebrow" id="stage">JAPANESE FLUENCY 1000</div><h1 id="title">수업을 불러오는 중</h1><p id="summary"></p></section><section class="panel"><h2>🎯 오늘의 학습 목표</h2><p id="objective"></p><span class="tag" id="theme"></span></section><section class="panel"><h2>📘 핵심 문법</h2><p class="jp" id="grammar"></p><p>오늘은 문형의 의미와 사용 조건을 이해한 뒤, 예문을 직접 바꾸어 말해 보세요.</p></section><section class="panel"><h2>🧩 핵심 어휘</h2><div class="vocab" id="vocab"></div></section><section class="panel"><h2>✍️ 예문</h2><p class="jp" id="example"></p><p class="ko" id="translation"></p></section><section class="panel"><h2>🗣️ 짧은 회화</h2><p id="dialogue"></p></section><section class="panel"><h2>📝 오늘의 연습</h2><p id="practice"></p><details><summary>예시 답안과 확인 포인트</summary><p id="answer"></p></details></section><section class="panel"><h2>🔁 복습과 숙제</h2><p id="review"></p><p id="homework"></p><div class="actions"><button id="done">이 수업을 완료로 표시</button><button class="alt" onclick="history.back()">이전 화면</button></div><p class="note">진도는 현재 브라우저에 저장됩니다. 홈페이지의 Gist 백업 기능으로 동기화할 수 있습니다.</p></section></main><script src="lessons-data.js"></script><script>
(()=>{const q=new URLSearchParams(location.search),day=Math.max(1,Math.min(1000,Number(q.get('day'))||5)),d=(window.JAPANESE_LESSON_DATA||[]).find(x=>x.day===day);if(!d){document.getElementById('title').textContent='수업을 찾을 수 없습니다';return}const put=(id,v)=>document.getElementById(id).textContent=v;put('progress','DAY '+String(day).padStart(3,'0')+' / 1000');put('stage','STAGE '+d.stage+' · '+d.stageTitle);put('title',d.title);put('summary',d.summary);put('objective',d.objective);put('theme',d.theme);put('grammar',d.grammar);put('example',d.example.jp);put('translation',d.example.ko);put('dialogue',d.dialogue.map(x=>x[0]+': '+x[1]).join('\n'));put('practice',d.practice);put('answer',d.answer);put('review',d.review);put('homework',d.homework);const v=document.getElementById('vocab');d.vocabulary.forEach(x=>{const e=document.createElement('div');e.className='word';const b=document.createElement('b');b.textContent=x.jp;const s=document.createElement('span');s.textContent=x.ko;e.append(b,s);v.append(e)});document.getElementById('done').onclick=()=>{let a=[];try{a=JSON.parse(localStorage.getItem('japanese-study-completed-days')||'[]')}catch(e){}if(!a.includes(day))a.push(day);localStorage.setItem('japanese-study-completed-days',JSON.stringify(a));alert('DAY '+day+' 완료! 홈으로 돌아가면 진도에 반영됩니다.')}})();
</script></body></html>
